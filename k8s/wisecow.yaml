apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels: {app: wisecow}
spec:
  replicas: 2
  selector:
    matchLabels: {app: wisecow}
  template:
    metadata:
      labels: {app: wisecow}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: wisecow
          image: ghcr.io/OWNER/REPOSITORY:main
          ports:
            - {containerPort: 4499, name: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: wisecow
spec:
  selector: {app: wisecow}
  ports:
    - {name: http, port: 80, targetPort: 4499}
  type: ClusterIP
