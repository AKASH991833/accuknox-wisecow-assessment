name: Build and publish Wisecow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:main,${{ steps.image.outputs.name }}:${{ github.sha }}

  cluster-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Create local cluster
        run: kind create cluster --wait 120s
      - name: Build and load image
        run: |
          docker build -t wisecow:smoke .
          kind load docker-image wisecow:smoke
      - name: Deploy and smoke test
        run: |
          sed 's#ghcr.io/OWNER/REPOSITORY:main#wisecow:smoke#' k8s/wisecow.yaml | sed '/image: wisecow:smoke/a\          imagePullPolicy: IfNotPresent' | kubectl apply -f -
          kubectl rollout status deployment/wisecow --timeout=120s
          kubectl port-forward service/wisecow 8080:80 > /tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep -qx ok; then
              curl --fail --silent http://127.0.0.1:8080/ | grep -q '<pre>'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          kubectl get pods -o wide
          exit 1
      - name: Self-signed TLS proxy smoke test
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tls.key -out /tmp/tls.crt -days 1 -subj '/CN=wisecow.local' -addext 'subjectAltName=DNS:wisecow.local'
          kubectl create secret tls wisecow-tls --cert=/tmp/tls.crt --key=/tmp/tls.key
          kubectl apply -f k8s/tls-proxy.yaml
          kubectl rollout status deployment/wisecow-tls --timeout=120s
          kubectl port-forward service/wisecow-tls 8443:443 > /tmp/tls-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --noproxy "*" --cacert /tmp/tls.crt --resolve wisecow.local:8443:127.0.0.1 https://wisecow.local:8443/healthz | grep -qx ok; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tls-forward.log
          kubectl describe pods -l app=wisecow-tls
          exit 1
